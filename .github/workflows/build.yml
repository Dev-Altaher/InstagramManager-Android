name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython
          pip install -r requirements.txt
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libffi-dev \
            libssl-dev \
            libjpeg-dev \
            zlib1g-dev \
            openjdk-11-jdk \
            wget \
            git \
            unzip
      
      - name: Setup Android SDK
        run: |
          mkdir -p ~/Android/sdk
          cd ~/Android/sdk
          
          # Download and extract NDK
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip
          
          # Download and extract command-line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          
          # Create proper directory structure
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest 2>/dev/null || true
          
          # Accept SDK licenses
          mkdir -p licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > licenses/android-sdk-license
          echo "504667f4c0de7973335447fc6aeaae83a7previewlicense" > licenses/android-sdk-preview-license
      
      - name: Install Android SDK tools
        run: |
          export ANDROID_HOME=$HOME/Android/sdk
          export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          
          # Install build-tools and platforms using yes to accept prompts
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools"
          
          # Create symlink for buildozer
          mkdir -p $HOME/.buildozer/android/platform/android-sdk
          ln -sf $ANDROID_HOME/build-tools $HOME/.buildozer/android/platform/android-sdk/build-tools || true
          ln -sf $ANDROID_HOME/platforms $HOME/.buildozer/android/platform/android-sdk/platforms || true
          ln -sf $ANDROID_HOME/platform-tools $HOME/.buildozer/android/platform/android-sdk/platform-tools || true
      
      - name: Build APK with Buildozer
        run: |
          export ANDROID_HOME=$HOME/Android/sdk
          export ANDROID_NDK_HOME=$HOME/Android/sdk/android-ndk-r25b
          export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
          buildozer android debug
        env:
          ANDROID_HOME: ${{ runner.home }}/Android/sdk
          ANDROID_NDK_HOME: ${{ runner.home }}/Android/sdk/android-ndk-r25b
          JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: instagram-manager.apk
          path: bin/*.apk
          
      - name: Upload Build Logs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: buildozer-logs
          path: .buildozer/android/platform/build-*/build/logs/
